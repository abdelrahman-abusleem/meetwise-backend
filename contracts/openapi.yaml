components:
  securitySchemes:
    cookieRefresh:
      type: apiKey
      in: cookie
      name: meetwise_refresh_token
    setupBootstrap:
      type: apiKey
      in: header
      name: x-meetwise-setup-token
      description: >-
        Server-local CLI-issued random digest-only15-minute first-OWNER credential. Required with
        trusted Origin; consumed atomically.

    cookieAccess:
      type: apiKey
      in: cookie
      name: meetwise_access_token
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    temporaryResetCredential:
      type: http
      scheme: bearer
      description: One-use administrative reset credential; not a session JWT or OWNER recovery credential.
    activationCredential:
      type: http
      scheme: bearer
      description: One-use account activation credential, not session JWT or reset/recovery credential.
  schemas:
    MeetingKind:
      type: string
      enum:
        - TECH
        - SALES
        - GENERAL
    MeetingVisibility:
      type: string
      enum:
        - DEPARTMENT
        - PRIVATE
        - COMPANY
    MeetingLifecycle:
      type: string
      enum:
        - DRAFT
        - SCHEDULED
        - IN_PROGRESS
        - ENDED
        - CANCELLED
    ExecutionState:
      type: string
      enum:
        - PENDING
        - DISPATCHING
        - SUCCEEDED
        - RETRYABLE_FAILED
        - PERMANENT_FAILED
        - UNKNOWN
        - CANCELLED
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
    MeetingCreate:
      type: object
      additionalProperties: false
      required:
        - kind
        - title
      properties:
        kind:
          $ref: '#/components/schemas/MeetingKind'
        departmentId:
          type: string
          format: uuid
        visibility:
          $ref: '#/components/schemas/MeetingVisibility'
        title:
          type: string
          minLength: 1
          maxLength: 240
        scheduledAt:
          type: string
          format: date-time
        timeZone:
          type: string
          maxLength: 80
        joinUrl:
          type: string
          format: uri
          maxLength: 1000
        meetingAdminId:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
      description: >-
        TECH/SALES require departmentId and default DEPARTMENT; GENERAL forbids departmentId and
        defaults COMPANY without a guest prerequisite. PRIVATE requires current creator management
        authority. These defaults are approved MW024/MW042. Candidate creation is DRAFT-only;
        seriesId currently returns422 rather than silently binding an unimplemented series.
    MeetingUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 240
        scheduledAt:
          type: string
          format: date-time
        joinUrl:
          type: string
          format: uri
        visibility:
          $ref: '#/components/schemas/MeetingVisibility'
    Meeting:
      type: object
      required:
        - id
        - kind
        - visibility
        - createdById
        - meetingAdminId
        - lifecycle
        - version
        - scheduleVersion
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MeetingKind'
        departmentId:
          type:
            - string
            - 'null'
          format: uuid
        visibility:
          $ref: '#/components/schemas/MeetingVisibility'
        title:
          type: string
        createdById:
          type: string
          format: uuid
          readOnly: true
        meetingAdminId:
          type: string
          format: uuid
          readOnly: true
        lifecycle:
          $ref: '#/components/schemas/MeetingLifecycle'
        capture:
          type: string
        transcript:
          type: string
        analysis:
          type: string
        review:
          type: string
        scheduleVersion:
          type: integer
        version:
          type: integer
        scheduledAt:
          type:
            - string
            - 'null'
          format: date-time
    MeetingPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Meeting'
        nextCursor:
          type:
            - string
            - 'null'
    TransferRequest:
      type: object
      additionalProperties: false
      required:
        - newMeetingAdminId
        - reason
      properties:
        newMeetingAdminId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 1000
    CancelRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '\S'
    CancellationSubmissionResult:
      type: object
      additionalProperties: false
      required: [id, meetingId, requestedById, status, version]
      properties:
        id:
          type: string
          format: uuid
        meetingId:
          type: string
          format: uuid
        requestedById:
          type: string
          format: uuid
        status:
          type: string
          enum: [REQUESTED]
        version:
          type: integer
          minimum: 0
          maximum: 0
    CancellationDecisionResult:
      allOf:
        - $ref: '#/components/schemas/MeetingCancelRecord'
      type: object
      additionalProperties: false
      required: [id, meetingId, requestedById, status, version]
      properties:
        id:
          type: string
          format: uuid
        meetingId:
          type: string
          format: uuid
        requestedById:
          type: string
          format: uuid
        status:
          type: string
          enum: [APPROVED, REJECTED]
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
    CancelDecision:
      type: object
      additionalProperties: false
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - APPROVE
            - REJECT
            - REASSIGN
        newMeetingAdminId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 1000
    AnalysisTrigger:
      type: object
      additionalProperties: false
      properties:
        outputLanguage:
          type: string
          enum:
            - ar
            - en
        templateVersion:
          type: string
    AnalysisItemPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 240
        description:
          type: string
          maxLength: 20000
        evidenceSegmentIds:
          type: array
          items:
            type: string
            format: uuid
    ApprovalRoute:
      type: object
      required:
        - connectionId
        - destination
        - operation
      properties:
        connectionId:
          type: string
          format: uuid
        destination:
          type: string
          enum:
            - JIRA
            - GITHUB
            - CRM
        targetId:
          type: string
          maxLength: 200
        operation:
          type: string
          enum:
            - CREATE
            - UPDATE_EXISTING
    ApprovalRequest:
      type: object
      additionalProperties: false
      required:
        - expectedItemVersion
        - routes
      properties:
        expectedItemVersion:
          type: integer
          minimum: 1
        duplicateDecision:
          type: string
          enum:
            - LINK_EXISTING
