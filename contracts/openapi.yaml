openapi: 3.1.0
info:
  title: MeetWise API — Planning Contract
  version: 1.4.0-proposed
  description:
    DESIGN ONLY. Owner-approved Auto-Join and TECH/SALES/BOTH wizard; all endpoint/data details
    PROPOSED. Not a claim of implementation.
x-meetwise-status: PROPOSED
servers:
  - url: https://meetwise.example.com/api/v1
    description: Placeholder, not a live deployment
tags:
  - name: Auth
    description: Authentication, device sessions and account recovery; implementation status is declared per operation.
  - name: Departments
    description: Department membership and configuration contracts; implementation status is declared per operation.
  - name: Meetings
    description: Proposed meeting metadata and scheduling contracts; Phase 3 implementation remains gated.
  - name: Access
    description: Proposed meeting access and assignment contracts; administrative roles do not imply private content access.
  - name: Transcript
    description: Proposed transcript access contracts; live provider capture remains separately gated.
  - name: Analysis
    description: Proposed asynchronous AI-analysis contracts; extracted content is untrusted.
  - name: Review
    description: Proposed human review and approval contracts for analysis results.
  - name: Integrations
    description: Proposed provider connection contracts; external account access is not implied.
  - name: Executions
    description: Proposed authorized external-action execution and reconciliation contracts.
  - name: Notifications
    description: Proposed notification delivery and read-state contracts.
  - name: Webhooks
    description: Proposed provider event-ingress contracts; authentication and live capability verification remain required.
  - name: Operations
    description: Operational health and command-status contracts; implementation status is declared per operation.
  - name: Users
    description: System-account provisioning and activation contracts; other user operations remain proposed unless individually marked implemented.
  - name: Calendar
    description: Proposed calendar connection, event and OAuth contracts; deployment-specific provider support is unverified.
  - name: Audit
    description: Proposed metadata audit-query contracts; transcript content is not audit metadata.
  - name: Exports
    description: Proposed meeting export contracts; external execution authority is separate.
  - name: Privacy
    description: Proposed privacy and governed-deletion contracts; automatic retention or purge is not authorized.
  - name: Onboarding
    description: First-run draft and internal-activation contracts; implementation status is declared per operation.
  - name: System Settings
    description: Global bot and department-module configuration contracts; enabling a module does not authorize capture.
