      security:
        - cookieAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreate'
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Origin
          in: header
          required: true
          schema:
            type: string
          description: Must match configured WEB_APP_URL origin.
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: ^"(0|[1-9][0-9]{0,9})"$
          description: >-
            Quoted current membership revision;0 for never-granted membership; revoked grants retain
            their revision.
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[!-~]{1,128}$
      description: >-
        Approved MW033 Phase2 scoped membership only. System OWNER/MANAGER manage departments; current
        own Department ADMIN manages other MEMBER grants, not ADMIN/self escalation. Existing active
        nonpending system accounts only. Independent TECH/SALES grants; no GENERAL department,
        globalrole change or meeting/private-content grant. Current authority and session expiry
        checked under locks, version and request-key guards, atomic metadata audit. Future Phase3
        requires affected-meeting transfer/dependency checks; this is not implemented
        meeting-revocation workflow.
    get:
      tags:
        - Departments
      summary: List current authorized department membership metadata
      operationId: get_departments_departmentId_members
      description: >-
        Current system OWNER/MANAGER or own Department ADMIN only; authorization precedes cursor
        filtering. Returns member IDs/scoped roles/eligibility, not globaldirectory/privatecontent. No
        membership read grant for ordinary MEMBER in this administrative endpoint.
      x-meetwise-status: IMPLEMENTED_LOCAL
      servers:
        - url: /
          description: Implemented controller paths are rooted here; no /api/v1 runtime prefix.
      security:
        - cookieAccess: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Bounded scoped page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          description: Invalid, unauthorized, conflicting or failed operation
