name: MeetWise quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: mw/${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [build, typecheck, lint, unit, e2e, security]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ci-unused@127.0.0.1:1/meetwise_ci
      PASSWORD_RESET_TTL_SECONDS: '300'
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1'
      SMTP_FROM: ci@example.invalid
      WEB_APP_URL: http://127.0.0.1:1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Create ephemeral test signing keys
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          for (const name of ['JWT_ACCESS_SECRET', 'JWT_REFRESH_SECRET', 'PASSWORD_RESET_SECRET']) {
            const value = crypto.randomBytes(48).toString('hex');
            console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          NODE
      - name: Lockfile install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client
        run: node node_modules/prisma/build/index.js generate
      - name: Run check
        shell: bash
        env:
          MW_CHECK: ${{ matrix.check }}
        run: |
          case "$MW_CHECK" in
            build) npm run build ;;
            typecheck)
              scripts=$(node -p 'Object.keys(require("./package.json").scripts).filter(name => name.startsWith("typecheck:")).join(" ")')
              test -n "$scripts"
              for script in $scripts; do
                npm run "$script"
              done
              npm run schema:validate:offline
              ;;
            lint)
              npm run lint
              git ls-files -z -- '*.ts' '*.cjs' '*.mjs' '*.json' '*.md' '*.yml' '*.yaml' | xargs -0 node node_modules/prettier/bin/prettier.cjs --check
              ;;
            unit)
              npm test -- --runInBand --no-cache
              node --test test/infrastructure/*.test.cjs
              node scripts/validate_openapi.cjs contracts/openapi.yaml
              python3 -B -m unittest discover -s scripts -p 'test_s1_quality_*.py' -v
              python3 -B -m unittest discover -s deploy/s1 -p test_toolkit.py -v
              npm run test:meetings
              ;;
            e2e) npm run test:e2e -- --runInBand --no-cache ;;
            security)
              node <<'NODE'
          const cp = require('node:child_process');
          const fs = require('node:fs');
          const paths = cp.execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const forbiddenPath = /(^|\/)(\.env$|.*private.*\.(pem|key)$|.*\.(dump|bak|bundle)$)/i;
          const privateKey = /-----BEGIN (?:RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----/;
          const providerToken = /\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|AIza[A-Za-z0-9_-]{30,}|(?:AKIA|ASIA)[A-Z0-9]{16})\b/;
          const findings = paths.filter(path => forbiddenPath.test(path) || privateKey.test(fs.readFileSync(path, 'utf8')) || providerToken.test(fs.readFileSync(path, 'utf8')));
          if (findings.length) {
            console.error('Sensitive file or credential marker found; values withheld.');
            process.exitCode = 1;
          }
          NODE
              npm run test:security
              npm run test:integration
              npm audit --audit-level=high
              ;;
            *) exit 2 ;;
          esac
